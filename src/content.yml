home:
  pitch:
    title: ALFR3D runs your home. You still own it.
    lines:
      - A self-hosted, local-first home-automation platform — a containerized backend that actually knows what day it is and what's playing, and Nexus Launcher, an Android home screen built to talk to it directly.
      - No ad tier. Not now, not ever. That's not a pricing decision, it's a policy.
    cta:
      text: → See what ALFR3D can do
      href: alfr3d.html
  highlights:
    - title: Self-hosted
      text: Runs on hardware you own — the platform costs nothing to run yourself, the way it should.
    - title: No ads, ever
      text: Excluded by policy, not by roadmap. Your home's data never leaves your network unless you decide it should.
