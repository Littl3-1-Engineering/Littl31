          scrip: "1,337 Scrip"
          label: Founding 100 · one-time
          accent: amber
          badge: Not yet available
          info: 'Planned: a numbered unit (e.g. "#014 of 100"), lifetime Relay included for as long as you own the Kit, Alfr3d Deck Pro unlocked free, and direct founder support. Once all 100 ship, this price goes away for good — it becomes the $450 steady-state price below. No hardware has shipped yet — this is the plan, not an open order.'
          cta:
            text: → Join the founding-100 waitlist
            href: 'mailto:athos@littl31.com?subject=Alfr3d%20Kit%20%E2%80%94%20Founding%20100%20waitlist'
          note: "Not yet available — target Q4 '26."
