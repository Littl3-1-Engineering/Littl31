home:
  pitch:
    title: Alfr3d is the only home butler you own.
    lead: "It notices a calendar event across town and quietly tells you when to leave — computed on your own hardware, from your own calendar, with no Google API key and no cloud call. That's not a notification bolted onto a control panel. That's the product."
    lines:
      - No ad tier. Not now, not ever. That's not a pricing decision, it's a policy.
  highlights:
    - title: Anticipation
      text: A 19-rule situational-awareness engine watches your calendar, your devices, and your household's own rhythm — surfacing exactly one thing worth knowing, before you'd think to ask.
    - title: Character
      text: A personality layer with a voice that stays coherent instead of wearing thin — quips and greetings, not a wall of notifications.
    - title: Ownership
      text: It never phones home, never fakes a reading, never locks you in. Self-hosted by default, with a hosted layer you can opt into — never the other way around.
  howItWorks:
    title: How it's actually built
    lines:
      - Underneath all of that is a containerized microservices backend coordinating over Kafka, plus Alfr3d Deck, an Android home screen built to talk to it directly.
      - This is the plumbing, not the pitch — proof it's real, not the reason to care.
    cta:
      text: → See what Alfr3d can do
      href: alfr3d.html
  about:
    title: Littl3.1 Engineering
    lines:
      - Littl3.1 is a small, deliberately selective engineering shop. ALFR3D is the flagship — everything else is R&D, prototypes, and one-off builds, kept in the Lab.
    cta:
      text: → Visit the Lab
      href: lab.html

footer:
  email: athos@littl31.com
  text: No ads, no telemetry, by design — not a pricing tier, a policy. Littl3.1 Engineering builds deliberately and ships selectively.

alfr3d:
  meta:
    title: 'ALFR3D : Self-Hosted Home Automation'
    description: ALFR3D is a self-hosted home butler that anticipates what you need — no ads, no telemetry, and it runs on hardware you own.
  badges:
    - text: Open source · FSL-1.1-ALv2
      accent: amber
    - text: by Littl3.1 Engineering
      accent: orange
  intro:
    title: It notices things before you ask.
    lead: "Most \"smart home\" software is a stranger living in your house — competent, forgettable, indifferent to the particulars of you. Alfr3d isn't interested in being competent. It's interested in you: the drive that always takes longer than the map says, the lamp that stays on after the last person's left, the version of Tuesday that only looks like Tuesday from the outside. It learns the shape of an ordinary day in this house well enough to notice, quietly, the one moment that isn't — and it says so once, instead of piling on a wall of alerts. A few of the places that shows up:"
    bullets:
      - Leaves you enough time to get there — a leave-by time computed from your own calendar and a routing engine that runs on your own hardware, not a Google API key.
      - Notices when the house is empty and something's still on — a light, a space heater, whatever got left running after everyone's gone.
      - Knows when today isn't like your other Tuesdays — first activity two hours late, half the household still home at noon, whatever's actually unusual for you.
      - Picks up where you left off — pause a track on one screen, find it waiting on the next.
      - Goes quiet before bed — no idle chatter in the last stretch before your own Bedtime routine.
    lines:
      - None of it is a spec sheet, and none of it is behind a subscription — it's just what Alfr3d Core already does today, free, forever, self-hosted, quietly getting to know the house it lives in.
      - Home Assistant made self-hosting mainstream. Nabu Casa made it convenient. Alfr3d is built the same way — a real platform running on hardware you own, with a hosted layer you can opt into, never the other way around.
      - No ad tier. Not now, not ever. That's not a pricing decision, it's a policy.
      - It behaves like a butler, not a control panel — situational awareness, a personality layer, dashboards built to live on a wall, not hide in an app. The parts of "smart home" that usually stay locked behind someone else's cloud.
    cta:
      text: → See the full timeline
      href: timeline.html
  commerceNotes:
    - title: Open source, actually
      text: "Licensed FSL-1.1-ALv2: you can run it, modify it, and never pay us. The one thing you can't do is resell hosted ALFR3D as a competing service — and even that restriction expires after two years, at which point the license converts to Apache 2.0."
    - title: The Relay commitment
      text: "Once it ships, Relay access will be included for the life of your Kit. If we ever discontinue the hosted relay, we'll open-source the relay server so you can run your own instead of losing the feature outright."
  products:
    - title: Alfr3d Kit
      id: p-kit
      eyebrow: / ALFR3D KIT
      accent: amber
      wide: true
      badge:
        text: Coming soon — founding batch of 100 planned
        accent: gray
      quip: A butler, boxed and ready to ship. Numbered, not mass-produced.
      lines:
        - "A Raspberry Pi, pre-flashed with ALFR3D Core and shipped ready to plug in — no Docker Compose, no manual setup, just power and a network connection. Built to order, not stocked."
        - "The lead way to get ALFR3D, once it ships: every Kit will include a lifetime Relay connection and Alfr3d Deck Pro unlocked for free. The first 100 units will be numbered, with a direct line to me for support instead of a ticket queue."
      pricing:
        - amounts:
            USD: $400
