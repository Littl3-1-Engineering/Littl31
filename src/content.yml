          cta:
            text: → Join the waitlist
            href: 'mailto:athos@littl31.com?subject=Alfr3d%20Kit%20%E2%80%94%20waitlist'
          note: "Not yet available — target Q2 '27."
        - amount: "$1,500–$2,500"
