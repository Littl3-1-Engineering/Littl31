alfr3d:
  meta:
    title: 'ALFR3D : Self-Hosted Home Automation'
    description: ALFR3D is a self-hosted, local-first home-automation platform by Littl3.1 Engineering. No ads, no telemetry, your home stays yours.
  badges:
    - text: Open source · FSL-1.1-ALv2
      accent: amber
    - text: by Littl3.1 Engineering
      accent: orange
  intro:
    title: Your house, your data, your rules.
    lines:
      - Home Assistant made self-hosting mainstream. Nabu Casa made it convenient. ALFR3D is built the same way — a real platform running on hardware you own, with a hosted layer you can opt into, never the other way around.
      - A containerized microservices backend, a situational-awareness engine that actually knows what day it is and what's playing, and Nexus Launcher — an Android home screen built to talk to it directly.
      - No ad tier. Not now, not ever. That's not a pricing decision, it's a policy.
      - It behaves like a butler, not a control panel — situational awareness, a personality layer, dashboards built to live on a wall, not hide in an app. The parts of "smart home" that usually stay locked behind someone else's cloud.
    cta:
      text: → See the full timeline
      href: timeline.html
  commerceNotes:
    - title: Open source, actually
      text: "Licensed FSL-1.1-ALv2: you can run it, modify it, and never pay us. The one thing you can't do is resell hosted ALFR3D as a competing service — and even that restriction expires after two years, at which point the license converts to Apache 2.0."
    - title: The Relay commitment
      text: "Once it ships, Relay access will be included for the life of your Kit. If we ever discontinue the hosted relay, we'll open-source the relay server so you can run your own instead of losing the feature outright."
  products:
    - title: Alfr3d Kit
      id: p-kit
      eyebrow: / ALFR3D KIT
      accent: amber
      wide: true
      badge:
        text: Coming soon — founding batch of 100 planned
        accent: gray
      quip: A butler, boxed and ready to ship. Numbered, not mass-produced.
      lines:
        - "A Raspberry Pi, pre-flashed with ALFR3D Core and shipped ready to plug in — no Docker Compose, no manual setup, just power and a network connection. Built to order, not stocked."
        - "The lead way to get ALFR3D, once it ships: every Kit will include a lifetime Relay connection and Nexus Launcher Pro unlocked for free. The first 100 units will be numbered, with a direct line to me for support instead of a ticket queue."
      pricing:
        - amount: $399
          label: Founding 100 · one-time
          accent: amber
          badge: Not yet available
          info: 'Planned: a numbered unit (e.g. "#014 of 100"), lifetime Relay included for as long as you own the Kit, Nexus Launcher Pro unlocked free, and direct founder support. Once all 100 ship, this price goes away for good — it becomes the $449 steady-state price below. No hardware has shipped yet — this is the plan, not an open order.'
          cta:
            text: → Join the founding-100 waitlist
            href: 'mailto:athos@littl31.com?subject=Alfr3d%20Kit%20%E2%80%94%20Founding%20100%20waitlist'
          note: "Not yet available — target Q4 '26."
        - amount: $449
          label: Steady-state · one-time
          badge: Not yet available
          info: The same Kit, same lifetime Relay, same free Nexus Launcher Pro — the planned ongoing price once all 100 founding units are gone. Not orderable yet.
          cta:
            text: → Join the waitlist
            href: 'mailto:athos@littl31.com?subject=Alfr3d%20Kit%20%E2%80%94%20waitlist'
          note: "Not yet available — target Q2 '27."
    - title: Nexus Launcher
      id: p-launcher
      eyebrow: / NEXUS LAUNCHER
      accent: cyan
      badge:
        text: Coming soon — targeting Google Play in Q4 '26
        accent: gray
      img: 'assets/images/nexus-launcher-radial.jpg'
      imgCaption: The Ambient Brief card, mid-gathering — real presence data, not a canned notification.
      quip: I've taken the liberty of arranging your applications. You're welcome.
      lines:
        - "A free-form spatial launcher for Android: no permanent dock, no fixed grid. Apps, the terminal, and ALFR3D surfaces open as free-floating windows on an infinite canvas — summoned by double-tap search or the Nexus Core's press-and-flow radial menu, with live situational-awareness cards updating right on the canvas."
        - "In active development, not yet published. The plan: a free core, forever, with a one-time unlock that removes the ceiling — no subscription, because a launcher sitting on your own phone doesn't cost us a server bill to run."
      wide: true
      pricing:
        - amount: Coming soon
          label: Not yet published to Google Play
          badge: Not yet available
          info: 'Planned at launch: a free core (full spatial canvas, Nexus Core radial menu, double-tap search, window manager, terminal, base theming — no trial timer, no expiring feature ceiling) plus a $5.99 one-time Pro unlock via Google Play Billing (extra themes/icon packs, advanced window layouts, backup & restore). Free automatically for Alfr3d Kit owners and Butler subscribers once live. Nothing is downloadable or purchasable yet.'
          cta:
            text: → Notify me on Google Play
            href: 'mailto:athos@littl31.com?subject=Nexus%20Launcher%20%E2%80%94%20notify%20me'
          note: "Not yet available — target Q4 '26."
    - title: ALFR3D Core
      id: p-core
      eyebrow: / ALFR3D CORE
      right: true
      img: 'assets/images/alfr3d-dashboard.jpg'
      imgCaption: The Nexus dashboard — residents, situational awareness, and live container health, all on one wall panel.
      quip: The engine room. I keep it running so you never have to think about it.
      lines:
        - "The backend: containerized microservices — API, User, Device, Environment, and Speak — each one independent, coordinating only over Kafka, plus a Python daemon that handles situational awareness and voice routing. The result is a dashboard that actually looks like something you'd want on a wall panel — not a spreadsheet."
        - Stays free forever, stays self-hosted, stays local-first, no feature ceiling. This is the platform, not the product we're selling — think of it the way Home Assistant thinks of Home Assistant Core.
      pricing:
        - amount: Free
          label: Full platform, forever
          info: Self-hosted, local-first, updates included forever. Licensed FSL-1.1-ALv2 — run it and modify it without paying us a cent.
      cta:
        text: → View on GitHub
        href: 'https://github.com/Littl3-1-Engineering/alfr3d'
    - title: Butler
      id: p-butler
      eyebrow: / BUTLER
      right: true
      accent: amber
      badge:
        text: Coming soon — in development
        accent: gray
      quip: I remember your errands, your appointments, and exactly how you like your coffee. Butler edition me, anyway.
      lines:
        - "Not yet built. The plan: one subscription bundling Relay's remote access, plus push notifications, hosted encrypted backups, and the personality/quips layer that makes ALFR3D feel less like a control panel and more like staff."
        - "Relay — a thin, dumb-pipe connection for remote access with no port-forwarding and no plaintext ever passing through our servers — isn't sold on its own. It's included in Butler, and included free for the life of any Alfr3d Kit."
        - Fair-use LLM usage will be included — generous, capped to keep it sustainable, not throttled to nudge you into a bigger plan. Priority support included.
      pricing:
        - amount: $99/yr
          label: Butler · annual
          accent: amber
          badge: Recommended
          info: 'Planned pricing, not yet available. Works out to about $8.25/mo — two months free versus paying monthly. Relay + push + hosted encrypted backups + personality/quips (fair-use capped) + priority support.'
          cta:
            text: → Join the Butler waitlist
            href: 'mailto:athos@littl31.com?subject=Alfr3d%20Butler%20%E2%80%94%20waitlist%20(annual)'
        - amount: $9.99/mo
          label: Butler · monthly
          info: 'Planned pricing, not yet available. Same inclusions as annual, billed monthly.'
          cta:
            text: → Join the Butler waitlist
            href: 'mailto:athos@littl31.com?subject=Alfr3d%20Butler%20%E2%80%94%20waitlist'

privacy:
  meta:
    title: 'Privacy Policy : Littl3.1 Engineering'
    description: How Littl3.1 Engineering handles data across littl31.com, ALFR3D Core, Nexus Launcher, and the ALFR3D Kit, Relay, and Butler services once they launch.
  intro:
    title: Your data stays where you put it.
    lines:
      - 'Last updated: August 30, 2026.'
      - This policy covers everything Littl3.1 Engineering operates — this website (littl31.com), ALFR3D Core, Nexus Launcher, and the ALFR3D Kit, Relay, and Butler services once they launch.
      - "The short version: we don't run ads, we don't sell data, and most of what ALFR3D does happens entirely on hardware you own. Where that's not true — Google Play billing, a future hosted relay — we say so plainly below."
  sections:
    - id: no-ads
      eyebrow: § 1
      title: No ads, ever
      lines:
        - Littl3.1 Engineering does not run advertising, ad networks, or ad-tech tracking on littl31.com, ALFR3D Core, or Nexus Launcher, and never will. This isn't a pricing decision we might revisit — it's policy. We make money by selling hardware (the ALFR3D Kit) and optional subscriptions (Relay, Butler), never by selling attention or data.
    - id: website
      eyebrow: § 2
      title: littl31.com — this website
      lines:
        - This site doesn't have accounts, forms, or a database behind it. It's a static site with no analytics, no tracking pixels, and no cookies of any kind — we don't know who you are or that you visited.
        - "Every \"waitlist\" or \"notify me\" link on the ALFR3D product page opens your own email client via a mailto: link. Nothing is submitted to a server on this site — whatever you send is a normal email to athos@littl31.com, and you're in control of what it contains."
        - Our hosting providers — GitHub Pages for the site itself, and Cloudflare for the small payments backend described below — generate standard web server logs (IP address, browser type, request timestamps) as a normal part of serving any website. We don't access or use these logs ourselves; see GitHub's and Cloudflare's own privacy policies for how they handle them.
        - When Stripe checkout goes live for a paid product (it isn't yet — every pricing tier today is a waitlist link, not a working purchase), payment details will be entered directly into Stripe's own checkout page and processed by Stripe. We never see or store your card number; we'll only receive what Stripe tells us is needed to activate your order, such as confirmation a payment succeeded and an email to send a receipt to.
    - id: core
      eyebrow: § 3
      title: ALFR3D Core — the self-hosted backend
      lines:
        - ALFR3D Core is software you download and run on your own hardware — a Raspberry Pi, a home server, whatever you choose. There is no Littl3.1-operated server in this picture — your residents, devices, routines, camera streams, and situational-awareness history live in a database that you host, on a network you control. We never see it, store it, or have access to it.
        - Logging into your own ALFR3D instance uses a password you set, hashed and never stored in plain text; sessions use short-lived access tokens and revocable refresh tokens, all issued by your own instance. Credentials for anything you connect — Home Assistant, SmartThings, an ESPHome device, Spotify, an LLM API key — are encrypted at rest in your own database, not sent to us.
        - Integrations you configure yourself fall into two categories. Local integrations (Home Assistant, SmartThings, ESPHome devices) talk to your own instance over your own network and never touch the internet. A small number of optional integrations (Spotify, an LLM provider like Anthropic) do go out to the internet — but directly from your own ALFR3D instance to that provider, using credentials only you hold. Littl3.1's servers are never in that path.
        - Because ALFR3D Core is self-hosted, you're the one in control of retention and deletion — back it up, wipe it, or move it however you like. We can't do any of that for you, because we don't have a copy.
    - id: launcher
      eyebrow: § 4
      title: Nexus Launcher — the Android app
      lines:
        - Nexus Launcher is a home-screen replacement for Android, currently in development and not yet published to Google Play. This is the policy that will apply once it ships.
        - The launcher does not collect, transmit, sell, or share your personal data with us or any third party. Contacts, calendar, and file search results are read locally to power the Search Panel and never leave your device. The media-control window reads the OS's active media-session list (title, artist, app), never notification content. The "Lock" action uses Android's on-demand device-lock API only — no other device-admin policy is requested.
        - The only network requests the launcher makes are to an ALFR3D backend, if and only if you configure one yourself in Settings — the same self-hosted instance described above, under your control — and to your device's default browser when you explicitly choose to search the web.
        - The one paid feature, Nexus Launcher Pro, is a one-time unlock purchased through Google Play Billing. Google processes that payment; we receive confirmation that you own the unlock, never your payment details.
        - App-ranking data (which apps you use most) is stored locally on-device using Android's DataStore and is never transmitted anywhere. Uninstalling the launcher removes it.
    - id: hosted-services
      eyebrow: § 5
      title: ALFR3D Kit, Relay, and Butler — not yet available
      lines:
        - None of these exist yet — the Kit hasn't shipped, and Relay and Butler haven't been built. Nothing in this section collects any data today; we're publishing our design commitments now so they're on record before launch, and we'll update this policy — with a new "last updated" date, at this same URL — before any of it goes live.
        - Relay, the planned remote-access layer, is designed as a dumb pipe — an encrypted tunnel between your ALFR3D instance and your own client, relayed through our infrastructure without our servers ever seeing plaintext home data. Butler adds push notifications, hosted encrypted backups, and personality features on top.
        - Subscribing to Relay or Butler will require a billing identity (an email and payment method, handled through Stripe) — deliberately kept separate from the login you use inside your own household's ALFR3D instance. Knowing you're a subscriber won't give us, or anyone at Littl3.1, access to your home data.
    - id: children
      eyebrow: § 6
      title: Children's privacy
      lines:
        - Nothing Littl3.1 Engineering operates is directed at children, and we don't knowingly collect personal data from anyone under 13. Since littl31.com collects nothing and ALFR3D Core runs entirely on hardware the user controls, there's generally nothing here for us to collect from anyone, of any age.
    - id: your-control
      eyebrow: § 7
      title: Your data, your control
      lines:
        - For anything self-hosted — ALFR3D Core, and by extension Nexus Launcher's optional backend connection — you already hold all the data. Export it, delete it, or move it however you like; we have no copy to act on.
        - For anything that does touch us directly — an email you send us, a future Stripe subscription — email athos@littl31.com and we'll act on a request to access, correct, or delete it.
        - Littl3.1 Engineering is a registered business in Ontario, Canada, and this policy applies to visitors and users wherever they're located.
    - id: changes
      eyebrow: § 8
      title: Changes to this policy
      lines:
        - If this policy changes, the "Last updated" date at the top will change and the new version will be published at this same URL. Material changes — a new product going live, a new category of data collection — will also get a note in the section they affect.
    - id: reach-us
      eyebrow: § 9
      title: Questions
      lines:
        - Email athos@littl31.com — that's a real inbox we read, not a support ticket queue.

